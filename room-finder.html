<!DOCTYPE html><html lang="en" class="dark"><head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#09090b" />
  <meta name="description" content="Class Schedule" />
  <title>Class Schedule · NUST PNEC</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            brand: {
              300: '#a5b4fc',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5'
            },
            ink: {
              950: '#09090b',
              900: '#0f1014',
              850: '#14161c',
              800: '#191c24',
              700: '#242936'
            }
          }
        }
      }
    };
  </script>

  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 10% -5%, rgba(99,102,241,.13), transparent 28rem),
        radial-gradient(circle at 95% 5%, rgba(20,184,166,.08), transparent 24rem),
        #09090b;
      color: #f4f4f5;
      font-family: Inter, sans-serif;
    }

    ::selection { background: rgba(99,102,241,.35); }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #272a33; border-radius: 999px; }

    .hide-scrollbar { scrollbar-width: none; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }

    .glass {
      background: rgba(25, 28, 36, .72);
      border: 1px solid rgba(255,255,255,.07);
      box-shadow: 0 18px 55px rgba(0,0,0,.18);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .select-wrap { position: relative; min-width: 0; }
    .select-wrap::after {
      content: '';
      position: absolute;
      right: 14px;
      top: 50%;
      width: 7px;
      height: 7px;
      border-right: 1.5px solid #a1a1aa;
      border-bottom: 1.5px solid #a1a1aa;
      transform: translateY(-65%) rotate(45deg);
      pointer-events: none;
    }
    select {
      appearance: none;
      -webkit-appearance: none;
      width: 100%;
      background: #101217;
      color: #e4e4e7;
      border: 1px solid rgba(255,255,255,.08);
      outline: none;
      cursor: pointer;
    }
    select:hover { border-color: rgba(255,255,255,.16); }
    select:focus { border-color: rgba(99,102,241,.65); box-shadow: 0 0 0 3px rgba(99,102,241,.12); }

    .day-pill, .section-pill { flex: 0 0 auto; }
    .day-pill { transition: transform .18s ease, background .18s ease, border-color .18s ease; }
    .day-pill:active, .section-pill:active { transform: scale(.97); }

    .schedule-card {
      min-width: 0;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .schedule-card:hover {
      transform: translateY(-2px);
      border-color: rgba(99,102,241,.28);
      box-shadow: 0 14px 35px rgba(0,0,0,.18);
    }

    .subject-clamp {
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
    }

    html:not(.dark) { color-scheme: light; }
    html:not(.dark) body { background: radial-gradient(circle at 10% -5%, rgba(99,102,241,.10), transparent 28rem), radial-gradient(circle at 95% 5%, rgba(20,184,166,.07), transparent 24rem), #f5f7fb; color:#18181b; }
    html:not(.dark) .glass { background:rgba(255,255,255,.82); border-color:rgba(24,24,27,.08); box-shadow:0 18px 55px rgba(15,23,42,.08); }
    html:not(.dark) select { background:#fff; color:#27272a; border-color:rgba(24,24,27,.10); }
    html:not(.dark) .bg-ink-800 { background-color:#fff; }
    html:not(.dark) .bg-ink-700 { background-color:#f1f5f9; }
    html:not(.dark) .bg-ink-800\/70 { background-color:rgba(255,255,255,.88); }
    html:not(.dark) .bg-ink-800\/55 { background-color:rgba(255,255,255,.72); }
    html:not(.dark) .bg-ink-800\/45 { background-color:rgba(255,255,255,.68); }
    html:not(.dark) .bg-ink-800\/30 { background-color:rgba(255,255,255,.58); }
    html:not(.dark) .text-zinc-100 { color:#18181b; }
    html:not(.dark) .text-zinc-200 { color:#27272a; }
    html:not(.dark) .text-zinc-300 { color:#3f3f46; }
    html:not(.dark) .text-zinc-400 { color:#52525b; }
    html:not(.dark) .text-zinc-500 { color:#52525b; }
    html:not(.dark) .text-zinc-600 { color:#52525b; }
    html:not(.dark) .text-zinc-700 { color:#3f3f46; }
    /* Stronger light-mode text/card colors for WCAG-friendly contrast. */
    html:not(.dark) .text-indigo-200 { color:#4338ca; }
    html:not(.dark) .text-indigo-300 { color:#4f46e5; }
    html:not(.dark) .text-sky-200 { color:#0369a1; }
    html:not(.dark) .text-sky-300 { color:#0284c7; }
    html:not(.dark) .text-emerald-200 { color:#047857; }
    html:not(.dark) .text-emerald-300 { color:#059669; }
    html:not(.dark) .text-violet-200 { color:#6d28d9; }
    html:not(.dark) .text-violet-300 { color:#7c3aed; }
    html:not(.dark) .text-amber-300 { color:#92400e; }
    html:not(.dark) .text-teal-300 { color:#0f766e; }
    html:not(.dark) .text-brand-300 { color:#4338ca; }
    html:not(.dark) .bg-indigo-500\/\[\.13\] { background-color:rgba(99,102,241,.10); }
    html:not(.dark) .bg-sky-500\/\[\.12\] { background-color:rgba(14,165,233,.10); }
    html:not(.dark) .bg-emerald-500\/\[\.13\] { background-color:rgba(16,185,129,.10); }
    html:not(.dark) .bg-violet-500\/\[\.12\] { background-color:rgba(139,92,246,.10); }
    html:not(.dark) .bg-amber-400\/\[\.10\] { background-color:rgba(245,158,11,.10); }
    html:not(.dark) .text-rose-500 { color:#e11d48; }
    html:not(.dark) .border-white\/6 { border-color:rgba(24,24,27,.08); }
    html:not(.dark) .border-white\/7 { border-color:rgba(24,24,27,.09); }
    html:not(.dark) .border-white\/8 { border-color:rgba(24,24,27,.10); }
    html:not(.dark) .bg-black\/20 { background-color:rgba(24,24,27,.06); }

    @media (max-width: 640px) {
      html.dark body { background: #09090b; }
      .glass { backdrop-filter: none; -webkit-backdrop-filter: none; }
      .schedule-card:hover { transform: none; }
    }
  </style>
</head>
<body class="min-h-screen text-zinc-100 antialiased">
  <main class="mx-auto w-full max-w-4xl px-4 pb-10 pt-5 sm:px-6 sm:pt-8">
    <a href="index.html" class="inline-flex items-center gap-2 rounded-xl border border-white/7 bg-ink-800/70 px-3 py-2 text-xs font-bold text-zinc-400 transition hover:text-zinc-100">← Back to Schedule</a>

    <section class="mt-5 glass rounded-[28px] p-5 sm:p-7">
      <div class="flex items-start gap-4">
        <div class="flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl bg-brand-500/15 text-2xl">🏫</div>
        <div><h1 class="text-2xl font-extrabold tracking-tight text-zinc-100">Room Finder</h1><p class="mt-1 text-sm text-zinc-500">Find out which class is happening in any room right now.</p></div>
      </div>
      <div class="select-wrap mt-6"><label for="roomSelect" class="sr-only">Room</label><select id="roomSelect" class="h-13 rounded-2xl px-4 pr-10 text-sm font-semibold"><option value="">Select a room</option></select></div>
      <div id="status" class="mt-4" aria-live="polite"></div>
    </section>
  </main>
  <script>
    const DAYS=['Mon','Tue','Wed','Thu','Fri']; const $=id=>document.getElementById(id); let data=null;
    function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
    function parse(v){const m=String(v||'').trim().toUpperCase().match(/^(\d{1,2})(?::(\d{2}))?\s*(AM|PM)?$/);if(!m)return null;let h=+m[1],mi=+(m[2]||0),ap=m[3];if(mi>59)return null;if(ap==='AM')h=h===12?0:h;else if(ap==='PM')h=h===12?12:h+12;else if(h>=1&&h<=6)h+=12;return h>23?null:h*60+mi;}
    function range(v){const p=String(v||'').split(/\s*-\s*/);if(p.length!==2)return null;let a=parse(p[0]),b=parse(p[1]);if(a==null||b==null)return null;if(b<=a)b+=720;return{start:a,end:b};}
    function rooms(){const s=new Set();function walk(n){if(!n||typeof n!=='object')return;if(Array.isArray(n)){n.forEach(walk);return;}if(n.location&&String(n.location).trim())s.add(String(n.location).trim());Object.values(n).forEach(walk);}walk(data);return[...s].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));}
    function current(room){const day=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date().getDay()];if(!DAYS.includes(day))return null;const now=new Date(),min=now.getHours()*60+now.getMinutes();let found=null;function walk(n,path=[]){if(!n||typeof n!=='object'||found)return;if(Array.isArray(n)){n.forEach(x=>walk(x,path));return;}if(Array.isArray(n.days?.[day]))for(const item of n.days[day]){const r=range(item.time);if(r&&item.location&&String(item.location).trim().toLowerCase()===room.trim().toLowerCase()&&min>=r.start&&min<r.end){found={item,r,faculty:path[0],semester:path[1],section:path[2]};return;}}Object.entries(n).forEach(([k,v])=>{if(k!=='days'&&k!=='info')walk(v,[...path,k]);});}walk(data);return found;}
    function render(){const room=$('roomSelect').value;if(!room){$('status').innerHTML='<div class="rounded-2xl border border-white/6 bg-ink-800/45 px-4 py-4 text-sm text-zinc-500">Select a room to check its current class.</div>';return;}const x=current(room);if(!x){$('status').innerHTML=`<div class="rounded-2xl border border-emerald-500/20 bg-emerald-500/[.07] px-4 py-5"><div class="font-extrabold text-emerald-300">✓ ${esc(room)} is free right now</div><p class="mt-1 text-xs text-zinc-500">No scheduled class is using this room at the moment.</p></div>`;return;}$('status').innerHTML=`<div class="rounded-2xl border border-emerald-500/25 bg-emerald-500/[.10] p-5"><div class="flex items-center justify-between gap-3"><span class="rounded-full bg-emerald-500/15 px-3 py-1.5 text-[10px] font-extrabold text-emerald-300">CLASS IN PROGRESS</span><span class="text-xs font-bold text-zinc-400">${esc(x.item.time)}</span></div><h2 class="mt-4 text-xl font-extrabold text-zinc-100">${esc(x.item.subject||'Class')}</h2><div class="mt-3 flex flex-wrap gap-3 text-xs text-zinc-400"><span>👤 ${esc(x.item.teacher||'—')}</span><span>🎓 ${esc(x.faculty||'—')}</span><span>Semester ${esc(x.semester||'—')}</span><span>Section ${esc(x.section||'—')}</span><span class="font-bold text-teal-300">📍 ${esc(room)}</span></div></div>`;}
    fetch('./schedule.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{data=d;const s=$('roomSelect');rooms().forEach(x=>s.add(new Option(x,x)));s.addEventListener('change',render);render();}).catch(()=>{$('status').innerHTML='<div class="rounded-2xl border border-rose-500/20 bg-rose-500/[.06] p-4 text-sm text-rose-300">Unable to load schedule.json.</div>';});setInterval(()=>data&&render(),30000);
  </script>
</body></html>
